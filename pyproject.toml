[project]
name = "cvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nandakishore7768-arch", email = "nandakishore7768@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.22.0rc0",
    "torch>=2.15.0",
    "ultralytics>=8.4.213",
]

[project.scripts]
cvision = "cvision:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
